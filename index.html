<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoShare Ranking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <p class="eyebrow">Fishing Ranking</p>
        <h1>PhotoShare</h1>
      </section>

      <section id="homeView" class="home-card view" aria-labelledby="home-title">
        <div>
          <h2 id="home-title">ランキングを見る</h2>
        </div>

        <div id="genreButtons" class="genre-buttons"></div>

        <div id="homeEmptyState" class="mini-empty">
          まだジャンルがありません。写真登録から最初のジャンルを作成してください。
        </div>

        <button id="showUploadButton" class="primary-button" type="button">写真登録画面へ</button>
      </section>

      <section id="uploadView" class="upload-card view is-hidden" aria-labelledby="upload-title">
        <button class="back-button" data-view="home" type="button">← 最初の画面へ戻る</button>
        <div>
          <h2 id="upload-title">写真を登録</h2>
          <p>ジャンルタイトル、名前、サイズ、コメントを入力して画像をアップロードします。</p>
          <p>保存時に画像は自動で縮小・圧縮されるため、たくさん登録しても容量不足になりにくくなっています。</p>
        </div>

        <form id="uploadForm" class="upload-form">
          <label>
            ジャンルタイトル
            <input id="genreTitle" type="text" list="genreList" placeholder="例: 風景、料理、作品集" required />
            <datalist id="genreList"></datalist>
          </label>

          <label>
            ニックネーム
            <input id="photoName" type="text" placeholder="例: たろう" required />
          </label>

          <label>
            サイズ
            <input id="photoSize" type="text" inputmode="decimal" placeholder="例: 120" required />
          </label>

          <label>
            釣果日
            <input id="catchDate" type="date" />
          </label>

          <label>
            コメント
            <textarea id="photoComment" rows="3" placeholder="この画像へのコメント"></textarea>
          </label>

          <label class="upload-drop">
            <input id="photoInput" type="file" accept="image/*" multiple required />
            <span class="upload-icon">+</span>
            <span id="fileLabel">画像を選択（複数可）</span>
          </label>

          <button class="primary-button" type="submit">ランキングに追加</button>
        </form>
      </section>

      <section id="rankingView" class="gallery-section view is-hidden" aria-labelledby="gallery-title">
        <div class="section-heading">
          <h2 id="gallery-title">ランキング</h2>
          <button class="back-button" data-view="home" type="button">← ジャンル選択へ戻る</button>
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-illustration"></div>
          <p>まだ画像がありません。</p>
          <span>最初の画像を登録すると、ジャンル別にランキング表示されます。</span>
        </div>

        <div id="gallery" class="gallery" aria-live="polite"></div>
      </section>

      <section id="editView" class="upload-card view is-hidden" aria-labelledby="edit-title">
        <button class="back-button" data-view="ranking" type="button">← ランキングへ戻る</button>
        <div>
          <h2 id="edit-title">データを編集</h2>
          <p>#1 を3回タップしたときだけ開ける編集画面です。</p>
        </div>

        <div class="edit-preview">
          <img id="editPreviewImage" alt="編集中の画像" />
          <span id="editDate" class="photo-date"></span>
        </div>

        <form id="editForm" class="upload-form">
          <label>
            ジャンルタイトル
            <input id="editGenreTitle" type="text" required />
          </label>

          <label>
            ニックネーム
            <input id="editPhotoName" type="text" required />
          </label>

          <label>
            サイズ
            <input id="editPhotoSize" type="text" inputmode="decimal" required />
          </label>

          <label>
            釣果日
            <input id="editCatchDate" type="date" />
          </label>

          <label>
            コメント
            <textarea id="editPhotoComment" rows="3" placeholder="この画像へのコメント"></textarea>
          </label>

          <button class="primary-button" type="submit">更新する</button>
          <button id="editDeleteButton" class="danger-button" type="button">このデータを削除</button>
        </form>
      </section>

      <section id="authView" class="auth-card" aria-labelledby="auth-title">
        <div>
          <p class="auth-label">Account</p>
          <h2 id="auth-title">ログイン</h2>
          <p id="authMessage">画像の投稿・編集にはログインが必要です。</p>
        </div>

        <form id="authForm" class="auth-form">
          <label>
            メールアドレス
            <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>

          <label>
            パスワード
            <input id="authPassword" type="password" autocomplete="current-password" minlength="6" required />
          </label>

          <div class="auth-actions">
            <button id="signInButton" class="primary-button" type="submit">ログイン</button>
            <button id="signUpButton" class="secondary-button" type="button">新規登録</button>
          </div>
        </form>

        <div id="signedInPanel" class="signed-in-panel" hidden>
          <span id="currentUserEmail"></span>
          <button id="signOutButton" class="secondary-button sign-out-button" type="button">ログアウト</button>
        </div>

        <button id="resetPasswordButton" class="text-button auth-help" type="button">
          パスワードを忘れた場合
        </button>
      </section>

      <div id="connectionNotice" class="connection-notice" hidden></div>
    </main>

    <template id="genreTemplate">
      <section class="genre-card">
        <div class="genre-heading">
          <div>
            <p class="genre-label">Genre</p>
            <h3></h3>
          </div>
          <span class="genre-count"></span>
        </div>
        <div class="rank-list"></div>
      </section>
    </template>

    <template id="photoCardTemplate">
      <article class="photo-card">
        <div class="rank-badge"></div>
        <div class="photo-carousel">
          <img alt="アップロードされた画像" />
          <button class="carousel-button carousel-prev" type="button" aria-label="前の画像">‹</button>
          <button class="carousel-button carousel-next" type="button" aria-label="次の画像">›</button>
          <span class="carousel-count"></span>
        </div>
        <div class="photo-body">
          <div class="photo-meta">
            <div>
              <h4></h4>
              <span class="photo-date"></span>
            </div>
            <button class="like-button" type="button" aria-label="いいね">
              <span class="like-icon">♡</span>
              <span>いいね</span>
              <span class="like-count">0</span>
            </button>
          </div>
          <dl class="photo-details">
            <div>
              <dt>サイズ</dt>
              <dd class="photo-size"></dd>
            </div>
            <div>
              <dt>コメント</dt>
              <dd class="photo-comment"></dd>
            </div>
          </dl>
        </div>
      </article>
    </template>

    <div id="imageViewer" class="image-viewer" hidden>
      <button id="imageViewerClose" class="image-viewer-close" type="button" aria-label="画像を閉じる">×</button>
      <img id="imageViewerImage" alt="" />
    </div>

    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
